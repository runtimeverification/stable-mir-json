name: 'Test Cachix Pin'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or SHA) of an existing release to verify'
        required: true
        type: string

jobs:
  verify-cachix-pin:
    name: 'Verify Cachix Pin'
    runs-on: [self-hosted, linux, normal]
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v7

      - name: 'Verify cachix publish and pin'
        uses: workflow/nix-shell-action@v4.0.0
        env:
          # No CACHIX_AUTH_TOKEN: check-cachix-pin.sh reads neither it nor any
          # other credential. It only curls the pin API and <hash>.narinfo, both
          # of which serve k-framework-binary unauthenticated.
          GC_DONT_GC: '1'
          OWNER_REPO: '${{ github.repository }}'
          REV: '${{ inputs.ref }}'
        with:
          packages: jq
          script: bash .github/scripts/check-cachix-pin.sh
